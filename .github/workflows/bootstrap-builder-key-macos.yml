name: Bootstrap macOS builder key

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  bootstrap-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore macOS builder private key
        id: keycache
        uses: actions/cache/restore@v4
        with:
          path: .builder-private-macos.pem
          key: daftarqarzsafeen-builder-rsa-macos-v1

      - name: Generate macOS builder private key
        if: steps.keycache.outputs.cache-hit != 'true'
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out .builder-private-macos.pem
          chmod 600 .builder-private-macos.pem

      - name: Save macOS builder private key
        if: steps.keycache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .builder-private-macos.pem
          key: daftarqarzsafeen-builder-rsa-macos-v1

      - name: Publish public modulus only
        run: |
          set -euo pipefail
          openssl rsa -in .builder-private-macos.pem -noout -modulus | sed 's/^Modulus=//' > builder-modulus-macos.hex
          printf '%s\n' '65537' > builder-exponent-macos.txt
          git config user.name "Encrypted Builder Bootstrap"
          git config user.email "builder@localhost"
          git add builder-modulus-macos.hex builder-exponent-macos.txt
          if ! git diff --cached --quiet; then
            git commit -m "Publish macOS builder public key"
            git push origin HEAD:main
          fi
